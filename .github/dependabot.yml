version: 2
updates:
  - package-ecosystem: npm
    # npm workspaces: the single root lockfile covers packages/*.
    directory: /
    schedule:
      interval: weekly
    groups:
      # @vitest/coverage-v8 declares an exact peer on vitest, so they must move together.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
    ignore:
      # Stay on TypeScript 6 until typescript-eslint's peer range
      # (>=4.8.4 <6.1.0 as of 8.72.0) admits 7, or `npm ci` fails with ERESOLVE
      # (#123); drop this entry then.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
