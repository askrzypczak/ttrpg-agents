<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ttrpg-agents</title>
    <style>
      body {
        font-family: sans-serif;
        font-size: 14px;
        margin: 12px;
        color: #e6edf3;
      }
      #status[data-kind="connected"] {
        color: #3fb950;
      }
      #status[data-kind="reconnecting"] {
        color: #d29922;
      }
      #sync-error {
        color: #f85149;
      }
      #hint,
      #edit-note {
        color: #9da7b3;
      }
    </style>
  </head>
  <body>
    <h3>ttrpg-agents</h3>
    <p id="status">Starting...</p>
    <p id="hint"></p>
    <button id="use-this-tab" hidden>Use this tab</button>
    <p id="sync-error"></p>
    <p id="edit-note"></p>
    <div id="overrides" hidden>
      <p>
        After connecting, the store set these over the table's values. A
        snapshot cannot tell an MCP change made while the extension was away
        from a clamped value.
      </p>
      <ul id="overrides-list"></ul>
      <button id="dismiss-overrides">Dismiss</button>
    </div>
    <p id="scene"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
