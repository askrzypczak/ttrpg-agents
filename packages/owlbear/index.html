<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ttrpg-agents</title>
    <style>
      body {
        font-family: sans-serif;
        font-size: 14px;
        margin: 12px;
        color: #e6edf3;
      }
      #status[data-kind="connected"] {
        color: #3fb950;
      }
      #status[data-kind="reconnecting"] {
        color: #d29922;
      }
      #sync-error {
        color: #f85149;
      }
      #hint,
      #edit-note,
      .reupload-hint,
      .type-art-hint {
        color: #9da7b3;
      }
      #art-prompt {
        color: #d29922;
      }
      #reupload {
        border: 1px solid #d29922;
        border-radius: 4px;
        padding: 0 8px;
      }
      #reupload-list,
      #type-art-list {
        padding-left: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
